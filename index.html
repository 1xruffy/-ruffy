<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ruffy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="max.png">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
body {
    height:100vh;
    background:black;
    overflow:hidden;
    color:white;
    cursor:url('cursor.png') 16 16, auto;
}

/* VIDEO */
#bg-video {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-4;
}

/* OVERLAY */
.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(10px);
    z-index:-3;
}

/* PARTICLES */
canvas {
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
}

/* CARD */
.card {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:35px 45px;
    border-radius:26px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(20px);
    text-align:center;
    opacity:0;
    animation:cardIn 1.2s ease forwards, rgbBorder 6s linear infinite;
    box-shadow:0 0 40px rgba(0,255,255,.3);
}

/* PROFILE */
.profile {
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid white;
    margin-bottom:15px;
    transition:.4s;
}
.profile:hover {
    transform:scale(1.08) rotate(-2deg);
    box-shadow:0 0 25px cyan,0 0 40px magenta;
}

/* NAME */
.name-row {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}
.name {
    font-size:28px;
    font-weight:bold;
}

/* DESC */
.desc {
    font-size:14px;
    opacity:.85;
    margin:12px 0 20px;
}

/* LINKS */
.links {
    display:flex;
    justify-content:center;
    gap:20px;
}
.links img {
    width:45px;
    transition:.3s;
}
.links img:hover {
    transform:scale(1.2);
    filter:drop-shadow(0 0 12px cyan);
}

/* FOUNDER */
.founder-container {
    margin-top:15px;
    position:relative;
}
.founder {
    width:60px;
    transition:.3s;
}
.founder:hover {
    transform:scale(1.2);
    filter:drop-shadow(0 0 15px gold);
}
.founder-text {
    position:absolute;
    bottom:110%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    padding:6px 14px;
    border-radius:14px;
    font-size:12px;
    color:gold;
    opacity:0;
    transition:.3s;
}
.founder-container:hover .founder-text {
    opacity:1;
    transform:translate(-50%,-6px);
}

/* STATS */
.stats {
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:20px;
    font-size:18px;
}
.stat {
    padding:6px 14px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    cursor:pointer;
    user-select:none;
    transition:.2s;
}
.stat:hover {
    transform:scale(1.1);
}
.liked {
    color:red;
    box-shadow:0 0 20px red;
}

/* ENTER */
#enter {
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    letter-spacing:2px;
    z-index:999;
    cursor:pointer;
    animation:pulse 1.5s infinite;
}
#enter.fade {
    animation:enterOut 1s forwards;
}

/* VOLUME */
.volume {
    position:fixed;
    bottom:20px;
    right:20px;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
    padding:10px 14px;
    border-radius:14px;
}

/* ANIMS */
@keyframes pulse {0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
@keyframes enterOut {to{opacity:0;transform:scale(1.2);filter:blur(20px)}}
@keyframes cardIn {to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes rgbBorder {
    0%{box-shadow:0 0 15px red}
    33%{box-shadow:0 0 20px cyan}
    66%{box-shadow:0 0 20px lime}
    100%{box-shadow:0 0 15px red}
}
</style>
</head>

<body>

<div id="enter">CLICK TO ENTER</div>

<video id="bg-video" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
</video>

<canvas id="particles"></canvas>
<div class="overlay"></div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<div class="card">
    <img src="max.png" class="profile">

    <div class="name-row">
        <img src="tick.png" width="20">
        <div class="name">Ruffy</div>
    </div>

    <div class="desc">Developer • Creator • Private Projects</div>

    <div class="links">
        <img src="discord.png" onclick="openLink('https://discord.gg/mVfUa8mq')">
        <img src="v3.png" onclick="openLink('https://discord.gg/mVfUa8mq')">
    </div>

    <div class="founder-container">
        <img src="founder.png" class="founder">
        <div class="founder-text">Founder</div>
    </div>

    <div class="stats">
        <div class="stat" id="likeBtn">❤️ <span id="likes">0</span></div>
        <div class="stat">👁️ <span id="views">0</span></div>
    </div>
</div>

<div class="volume">
    🔊 <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
/* ENTER */
const enter = document.getElementById("enter");
const music = document.getElementById("music");
music.volume = 0.5;

enter.onclick = () => {
    enter.classList.add("fade");
    setTimeout(()=>enter.remove(),1000);
    music.play();
};

/* VOLUME */
document.getElementById("vol").oninput = e => music.volume = e.target.value;

/* SOUNDS */
const hover = document.getElementById("hoverSound");
const click = document.getElementById("clickSound");
document.querySelectorAll("img").forEach(i => i.onmouseenter = () => hover.play());
function openLink(url){ click.play(); window.open(url,"_blank"); }

/* LIKE + VIEW SYSTEM */
const likeBtn = document.getElementById("likeBtn");
const likesEl = document.getElementById("likes");
const viewsEl = document.getElementById("views");

let views = localStorage.getItem("views");
views = views ? Number(views)+1 : 1;
localStorage.setItem("views", views);
viewsEl.textContent = views;

let likes = localStorage.getItem("likes") || 0;
let liked = localStorage.getItem("liked");

likesEl.textContent = likes;
if(liked) likeBtn.classList.add("liked");

likeBtn.onclick = () => {
    if(liked) return;
    likes++;
    localStorage.setItem("likes", likes);
    localStorage.setItem("liked", "true");
    likesEl.textContent = likes;
    likeBtn.classList.add("liked");
};

/* PARTICLES */
const c = document.getElementById("particles");
const ctx = c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight }
resize(); addEventListener("resize",resize);

let particles = Array.from({length:40},()=>({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*2+1,
    dx:(Math.random()-.5)*.5,
    dy:(Math.random()-.5)*.5
}));

function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    particles.forEach(p=>{
        p.x+=p.dx; p.y+=p.dy;
        if(p.x<0||p.x>c.width) p.dx*=-1;
        if(p.y<0||p.y>c.height) p.dy*=-1;
        ctx.fillStyle="rgba(0,255,255,.5)";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
    });
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
